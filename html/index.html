<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilos de disparo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="menu" class="menu" aria-hidden="true">
        <section id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="menu-title">
            <header id="drag-handle" class="panel__header">
                <div>
                    <p class="eyebrow">Weapon stance</p>
                    <h1 id="menu-title">Estilos de disparo</h1>
                    <p id="menu-subtitle" class="subtitle">Selecciona cómo apunta y dispara tu personaje.</p>
                </div>
                <button id="close" class="icon-button" type="button" aria-label="Cerrar menú">×</button>
            </header>

            <div id="styles" class="styles" aria-live="polite"></div>

            <footer class="panel__footer">
                <span>ESC para cerrar</span>
                <span id="status">Listo</span>
            </footer>
        </section>
    </main>

    <template id="style-card-template">
        <button class="style-card" type="button">
            <span class="style-card__media">
                <img class="style-card__image" alt="" draggable="false">
            </span>
            <span class="style-card__content">
                <span class="style-card__title"></span>
                <span class="style-card__description"></span>
            </span>
            <span class="style-card__badge">Aplicado</span>
        </button>
    </template>

    <script src="app.js"></script>
</body>
</html>
