<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JX Shooting Styles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="app" class="app" aria-hidden="true">
        <div id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="menu-title">
            <header id="drag-handle" class="panel-header">
                <div class="title-block">
                    <span id="eyebrow" class="eyebrow"></span>
                    <h1 id="menu-title"></h1>
                    <p id="menu-subtitle" class="subtitle"></p>
                </div>

                <button id="close" class="close-button" type="button" aria-label="">×</button>
            </header>

            <div id="styles" class="styles" aria-live="polite"></div>

            <footer class="panel-footer">
                <span id="footer-close"></span>
                <span id="footer-hint"></span>
                <span id="status" class="status-pill"></span>
            </footer>
        </div>
    </section>

    <template id="style-card-template">
        <button class="style-card" type="button">
            <span class="image-wrap">
                <img class="style-image" alt="" draggable="false">
            </span>

            <span class="card-info">
                <span class="style-title"></span>
                <span class="style-description"></span>
            </span>

            <span class="selected-badge"></span>
        </button>
    </template>

    <script src="app.js"></script>
</body>
</html>
